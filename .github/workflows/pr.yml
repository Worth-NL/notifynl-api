name: PR

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# No workflow-level concurrency: it would cancel a running helm upgrade in `deploy`.
permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.workflow }}.${{ github.ref }}.unit-test
      cancel-in-progress: true

    strategy:
      matrix:
        python-version: ["3.13"]

    services:
      db:
        image: postgres:15-bullseye
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: notification_api
          POSTGRES_USER: notify
          POSTGRES_PASSWORD: notify
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 1s
          --health-retries 10

      redis:
        image: redis:6.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      FLASK_APP: 'application:application'
      SQLALCHEMY_DATABASE_URI: postgresql://notify:notify@localhost/notification_api

    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - uses: actions/checkout@v4

      - uses: Worth-NL/ci-workflows/.github/actions/python-setup@feat/shared-ci-actions
        with:
          python-version: ${{ matrix.python-version }}

      - uses: Worth-NL/ci-workflows/.github/actions/python-test@feat/shared-ci-actions

  build:
    if: github.event.pull_request.draft == false && github.base_ref == 'develop'
    needs: unit-test
    concurrency:
      group: ${{ github.workflow }}.${{ github.ref }}.build
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    uses: Worth-NL/ci-workflows/.github/workflows/build-image.yml@feat/shared-ci-actions
    with:
      image: ghcr.io/worth-nl/notifynl-api

  deploy:
    if: github.event.pull_request.draft == false && github.base_ref == 'develop'
    needs: build
    permissions:
      contents: read
      pull-requests: write
    uses: Worth-NL/ci-workflows/.github/workflows/deploy-test.yml@feat/shared-ci-actions
    with:
      tag: ${{ needs.build.outputs.tag }}
      environment-url: https://api.test.notifynl.nl
      migration-revisions: true
      image-keys: |
        apps.api
        apps.apiWorkerRetryTasks
        apps.apiWorkerLetters
        apps.apiWorkerJobs
        apps.apiWorkerJobsSave
        apps.apiWorkerJobsSaveDocuments
        apps.apiWorkerResearch
        apps.apiWorkerSender
        apps.apiWorkerSenderLetters
        apps.apiWorkerPeriodic
        apps.apiWorkerReporting
        apps.apiWorkerInternal
        apps.apiWorkerReceipts
        apps.apiWorkerServiceCallbacks
        apps.apiWorkerServiceCallbacksRetry
        apps.apiWorkerMessagebox
        apps.apiWorkerReportRequestsNotificationsTasks
        apps.celeryBeat
        migrations.apiUpgrade
        orgBoundariesSync
      failure-hints: |-
        Check the test env k8s state and logs, and whether the Helm release needs a rollback.

        Most likely issues:
        - DB migration desync
        - Package visibility
        - ghcr.io credentials expiration or change
    secrets: inherit

  smoke-test:
    needs: deploy
    if: github.event.pull_request.draft == false
    concurrency:
      group: ${{ github.workflow }}.${{ github.ref }}.smoke-test
      cancel-in-progress: true

    # Must match what the called workflow's job requests -- a reusable
    # workflow can only maintain or reduce the caller's permissions, never
    # elevate them, and this workflow's top-level block grants contents: read
    # alone.
    permissions:
      contents: read
      checks: write
      pull-requests: write

    uses: Worth-NL/ci-workflows/.github/workflows/run-smoke-tests.yml@main
    with:
      project: api
    secrets: inherit
