name: GHCR tag cleanup

on:
  schedule:
    - cron: '23 2 * * *'   # 02:23 UTC daily
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    permissions:
      contents: read
      packages: write
    uses: Worth-NL/ci-workflows/.github/workflows/ghcr-cleanup.yml@main
    with:
      package-name: notifynl-api
