# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Trivy

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: Worth-NL/ci-workflows/.github/workflows/trivy-scan.yml@main
    with:
      image: ghcr.io/worth-nl/notifynl-api
