openapi: 3.0.3

info:
  title: NotifyNL API
  version: "v2"
  description: |
    De NotifyNL API stelt overheidsorganisaties in staat om e-mail, sms, brief en
    berichtenbox-notificaties te versturen aan burgers en bedrijven.

    Je kunt deze API direct integreren als je geen gebruik kunt maken van de beschikbare
    client libraries, of wanneer je besluit dat je niet alles via het OMC kunt doen.

    Ontwikkelaars kunnen ook gebruik maken van ons
    [OpenAPI-bestand](./openapi.yaml) in combinatie met tools zoals
    [Swagger](https://swagger.io/) en [Redoc](https://github.com/Redocly/redoc).

    ---

    ## Authenticatie

    Alle endpoints vereisen een `Authorization`-header met een JWT Bearer-token,
    opgebouwd vanuit je API-sleutel.

    Een API-sleutel heeft het formaat:
    ```
    {sleutelnaam}-{iss-uuid}-{geheime-sleutel-uuid}
    ```

    Bijvoorbeeld, als je API-sleutel
    `mijn_test_sleutel-26785a09-ab16-4eb0-8407-a37497a57506-3d844edf-8d35-48ac-975b-e847b4f122b0`
    is:

    - je API-sleutelnaam is `mijn_test_sleutel`
    - je `iss` (je dienst-ID) is `26785a09-ab16-4eb0-8407-a37497a57506`
    - je geheime sleutel is `3d844edf-8d35-48ac-975b-e847b4f122b0`

    JWT-header:
    ```json
    { "typ": "JWT", "alg": "HS256" }
    ```

    JWT-payload:
    ```json
    { "iss": "26785a09-ab16-4eb0-8407-a37497a57506", "iat": 1568818578 }
    ```

    `iat` (issued at) is de huidige tijd in UTC in epoch-seconden. Het token verloopt
    binnen 30 seconden na de huidige tijd.

    Raadpleeg de [JSON Web Tokens website](https://jwt.io/) voor meer informatie over
    het coderen van je autorisatieheader.

    Voeg het token als volgt toe aan elk verzoek:
    ```
    Authorization: Bearer <jwt-token>
    Content-Type: application/json
    ```

    ---

    ## API-sleutels

    Er zijn drie soorten API-sleutels:

    | Type | Beschrijving |
    |---|---|
    | **Test** | Voor het testen van je integratie; berichten worden **niet** echt verstuurd |
    | **Team en gastlijst** | Voor het versturen van echte berichten aan teamleden en je gastlijst tijdens de proefperiode |
    | **Live** | Voor het versturen van berichten aan iedereen; alleen beschikbaar als je dienst live is |

    **Gedrag van de testsleutel:**
    - Genereert realistische API-responsen
    - Berichten krijgen status `delivered` maar worden nooit echt verstuurd
    - Berichten verschijnen niet in het dashboard
    - Tellen niet mee voor dagelijkse limieten
    - Geen intrekking vereist

    **Speciale testnummers en -adressen (testsleutel):**

    | Telefoonnummer / E-mailadres | Respons |
    |---|---|
    | `+31600000003` | `temporary-failure` |
    | `+31600000002` | `permanent-failure` |
    | `temp-fail@simulator.notify` | `temporary-failure` |
    | `perm-fail@simulator.notify` | `permanent-failure` |
    | Elk ander geldig nummer of adres | `delivered` |

    **Gedrag van de team-en-gastlijst-sleutel:**
    - Verstuurt echte berichten aan teamleden en maximaal 5 gasten
    - Geeft een fout bij het versturen buiten de gastlijst
    - Berichten verschijnen in het dashboard en tellen mee voor dagelijkse limieten
    - Geen intrekking vereist

    **Gedrag van de live-sleutel:**
    - Verstuurt berichten aan iedereen
    - Berichten verschijnen in het dashboard en tellen mee voor dagelijkse limieten
    - Trek sleutels regelmatig in en vervang ze

    Een API-sleutel aanmaken:

    1. [Meld je aan bij NotifyNL](https://admin.notifynl.nl)
    2. Ga naar de pagina **API-integratie**
    3. Selecteer **API-sleutels**
    4. Selecteer **Maak een API-sleutel aan**

    ---

    ## Foutmeldingen

    Foutmeldingen bestaan uit:

    - een `status_code`, bijv. `400`
    - een `errors`-lijst met per fout een `error` (fouttype) en `message` (omschrijving)

    Gebruik de `status_code` of het `error`-veld in je code — niet de inhoud van
    `message`, want die kan veranderen.

    ```json
    {
      "status_code": 400,
      "errors": [
        {
          "error": "ValidationError",
          "message": "phone_number is not valid"
        }
      ]
    }
    ```

    ---

    ## Statussen

    ### E-mailstatussen

    | Status | Beschrijving |
    |---|---|
    | `created` | Bericht staat in de wachtrij |
    | `sending` | Bericht is verstuurd naar de provider |
    | `delivered` | Bericht is succesvol afgeleverd |
    | `permanent-failure` | Aflevering mislukt — e-mailadres ongeldig |
    | `temporary-failure` | Aflevering tijdelijk mislukt — inbox vol of spamfilter |
    | `technical-failure` | Technische fout tussen Notify en de provider |

    ### Sms-statussen

    | Status | Beschrijving |
    |---|---|
    | `created` | Bericht staat in de wachtrij |
    | `sending` | Bericht is verstuurd naar de provider |
    | `pending` | Wacht op meer afleverinformatie |
    | `sent` | Verstuurd naar een internationaal nummer |
    | `delivered` | Succesvol afgeleverd |
    | `permanent-failure` | Aflevering mislukt — telefoonnummer ongeldig of geblokkeerd |
    | `temporary-failure` | Aflevering tijdelijk mislukt — telefoon uit, geen bereik, inbox vol |
    | `technical-failure` | Technische fout — je wordt niet in rekening gebracht |

    ### Briefstatussen

    | Status | Beschrijving |
    |---|---|
    | `accepted` | Brief is verstuurd naar de drukker |
    | `received` | Brief is gedrukt en verstuurd |
    | `cancelled` | Verzending geannuleerd |
    | `technical-failure` | Onverwachte fout bij de drukker |
    | `permanent-failure` | De drukker kan de brief niet afdrukken |

    ---

    ## Limieten

    ### Snelheidslimieten

    Je bent beperkt tot 3.000 berichten per minuut per API-sleuteltype. Bij
    overschrijding ontvang je een `429`-fout (`RateLimitError`).

    ### Dagelijkse limieten

    | Dienststatus | Type API-sleutel | Dagelijkse limiet |
    |---|---|---|
    | Live | Team of live | 250.000 e-mails / 250.000 sms-berichten / 20.000 brieven |
    | Proef | Team | 50 e-mails of sms-berichten |
    | Live of proef | Test | Onbeperkt |

    Limieten worden gereset om middernacht UTC.

    ### Telefoonnetwerklimieten

    Als je herhaaldelijk sms-berichten stuurt naar hetzelfde nummer, kunnen
    telefoonnetwerken deze blokkeren. Uurlimiet:

    - 20 berichten met dezelfde inhoud
    - 100 berichten met willekeurige inhoud

    ---

    ## Testen

    Alle tests vinden plaats in de productieomgeving. Er is geen aparte testomgeving.

    ### Faalscenario's testen met een testsleutel

    | E-mailadres | Respons |
    |---|---|
    | `temp-fail@simulator.notify` | `temporary-failure` |
    | `perm-fail@simulator.notify` | `permanent-failure` |
    | Elk ander geldig adres of nummer | `delivered` |

    ---

    ## Callbacks

    Callbacks zijn `POST`-aanvragen die NotifyNL naar jouw dienst stuurt wanneer:

    - een e-mail of sms-bericht is afgeleverd of mislukt
    - je dienst een sms-bericht ontvangt

    ### Callbacks instellen

    1. [Meld je aan bij NotifyNL](https://admin.notifynl.nl)
    2. Ga naar de pagina **API-integratie**
    3. Selecteer **Callbacks**

    Je moet opgeven:
    - Een URL waarnaar Notify de callback stuurt
    - Een bearer-token dat Notify in de autorisatieheader plaatst

    ### Callbacks opnieuw proberen

    Als een `POST`-aanvraag naar jouw dienst mislukt, probeert Notify het elke
    5 minuten opnieuw, maximaal 5 keer.

    Callbacks worden verstuurd voor:

    - Afleverstatus van e-mail of sms (bezorgd of mislukt)
    - Teruggestuurde brieven

    ### Afleverbewijzen (e-mail en sms)

    De callback-payload voor afleverstatus bevat de volgende velden:

    | Sleutel | Beschrijving | Formaat |
    |---|---|---|
    | `id` | Notify's ID voor de statusmelding | UUID |
    | `reference` | De door de dienst opgegeven referentie | `12345678` of null |
    | `to` | Het e-mailadres of telefoonnummer van de ontvanger | `hello@voorbeeld.nl` of `+31612345678` |
    | `status` | De status van de notificatie | `delivered`, `permanent-failure`, `temporary-failure` of `technical-failure` |
    | `created_at` | Tijdstip waarop de dienst de aanvraag verstuurde | `2017-05-14T12:15:30.000000Z` |
    | `completed_at` | Laatste tijdstip waarop de status is bijgewerkt | `2017-05-14T12:15:30.000000Z` of null |
    | `sent_at` | Tijdstip waarop de notificatie is verstuurd | `2017-05-14T12:15:30.000000Z` of null |
    | `notification_type` | Het type notificatie | `email` of `sms` |
    | `template_id` | Het ID van het gebruikte template | UUID |
    | `template_version` | Het versienummer van het gebruikte template | `1` |

    ### Teruggestuurde brief callback

    Wanneer een brief wordt teruggestuurd door de bezorgdienst:

    | Sleutel | Beschrijving | Formaat |
    |---|---|---|
    | `notification_id` | ID van de briefnotificatie | UUID |
    | `reference` | De door de dienst opgegeven referentie | `12345678` of null |
    | `date_sent` | Tijdstip waarop de brief is verstuurd | `2017-05-14T12:15:30.000000Z` |
    | `sent_by` | E-mailadres van de afzender | `hello@voorbeeld.nl` of null |
    | `template_name` | Naam van het gebruikte template | `Brief sjabloon` |
    | `template_id` | ID van het gebruikte template | UUID |
    | `template_version` | Versienummer van het template | `1` |
    | `spreadsheet_file_name` | Naam van het batch-uploadbestand | `contactlijst.csv` of null |
    | `spreadsheet_row_number` | Rijnummer in het batch-bestand | `2` of null |
    | `upload_letter_file_name` | Naam van het geüploade briefbestand | `brief.pdf` of null |

